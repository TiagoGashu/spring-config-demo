server:
  port: 8081

spring:
  application:
    name: orders-service          # must match the file name in the config repo
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:s3cret}
    bus:
      enabled: true
      id: ${spring.application.name}:${spring.profiles.active}:${server.port}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
